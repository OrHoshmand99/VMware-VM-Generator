[General]
LanguageFile=English.ini
OS-Type=windows11-64
OS-Name=Windows 11
VM-Name=Windows 11
VM-Folder=C:\Virtual Machines

[Firmware]
Firmware=UEFI-f ; Can be BIOS, UEFI, BIOS-f (=forced), or UEFI-f (=forced)
[CPU]
Processors=2
CoresPerProcessor=1

[Memory]
; In MB, from 4 to 131072, must be a multiple of 4
RecommendedMin=1024
RecommendedDefault=2048
RecommendedMax=4096

[SCSI I/O Controller]
SCSI I/O Controller=LSILogicSAS ; Can be BusLogic, LSILogic, LSILogicSAS, or Paravirtualized
BusLogic=false
LSILogic=false
LSILogicSAS=true
Paravirtualized=true

[Sound Card]
Default=hdaudio ; Can be sb16, es1371, or hdaudio
SB16=false
ES1371=false
HDAudio=true

[Virtual Drive]
DefaultType=NVMe ; Can be IDE, SCSI, SATA, or NVMe
DefaultCapacity=64 ; In GB
IDE=true
SCSI=true
SATA=true
NVMe=true

[Drives]
FloppyCount=1 ; Can be up to 2
IDECDCount=0 ; Can be up to 3
SCSICDCount=0 ; Can be up to 10
SATACDCount=0 ; Can be up to 10

[BootCD]
OS-ISO=Windows 11.iso
OS-Controller=SATA ; Can be IDE, SCSI, or SATA
